<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4.1 - SVG House</title>
</head>
<body>
  <h1>Exercise 4.1: House and Garden in SVG</h1>

  <svg width="400" height="400" viewBox="0 0 400 400">
    <!-- rect: sky and ground -->
    <rect x="0" y="0" width="400" height="400" fill="skyblue" />
    <rect x="0" y="250" width="400" height="150" fill="green" />

    <!-- circle: sun -->
    <circle cx="340" cy="60" r="30" fill="yellow" />

    <!-- ellipse: cloud -->
    <ellipse cx="90" cy="60" rx="40" ry="20" fill="white" />

    <!-- rect: chimney (drawn before roof) -->
    <rect x="270" y="90" width="20" height="40" fill="firebrick" />

    <!-- polyline: smoke from chimney -->
    <polyline points="280,85 290,70 280,55 290,40"
              fill="none" stroke="gray" stroke-width="3" />

    <!-- rect: house body -->
    <rect x="150" y="150" width="150" height="120" fill="saddlebrown" />

    <!-- polygon: roof -->
    <polygon points="130,150 225,80 320,150" fill="peru" />

    <!-- rect + circle: door and doorknob -->
    <rect x="205" y="200" width="40" height="70" fill="sienna" />
    <circle cx="237" cy="237" r="3" fill="black" />

    <!-- g: two windows with the same style, positioned by translate -->
    <g id="windows" fill="lightblue" stroke="white" stroke-width="3">
      <rect width="35" height="35" transform="translate(165,175)" />
      <rect width="35" height="35" transform="translate(255,175)" />
    </g>

    <!-- rect + ellipse: tree -->
    <rect x="60" y="190" width="14" height="80" fill="sienna" />
    <ellipse cx="67" cy="170" rx="35" ry="40" fill="forestgreen" />

    <!-- path: curved garden path -->
    <path d="M 225 270 Q 180 310 225 340 T 225 400"
          fill="none" stroke="orange" stroke-width="6" />

    <!-- line: fence rail -->
    <line x1="320" y1="260" x2="400" y2="260" stroke="saddlebrown" stroke-width="4" />

    <!-- text: label -->
    <text x="150" y="295" font-size="18" fill="pink">Naazh's House</text>
  </svg>
<p>Each shape is annotated to show how the coordinates in the code match the drawing. The origin (0,0) is at the top-left corner and the y-axis points down.</p>
<img src="images/annotated-1.png" alt="Annotated screenshot of the SVG house showing coordinates of each shape" width="700">
</body>
</html>
